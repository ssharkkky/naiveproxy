name: M6 platform qualification

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native platform gate to run
        required: true
        type: choice
        options:
          - linux-x64
          - windows-x64-preflight
          - windows-x64
          - android-arm64-build
          - all-desktop

permissions:
  contents: read

concurrency:
  group: m6-platform-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: false

env:
  CACHE_EPOCH: 1
  CCACHE_MAXSIZE: 200M
  CCACHE_MAXFILES: 0

jobs:
  windows-x64-preflight:
    name: Windows x64 G5d preflight
    if: inputs.platform == 'windows-x64-preflight'
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out NaiveProxy
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preflight Windows runtime semantics
        timeout-minutes: 3
        run: |
          ./tests/m6/g5_windows_trust_preflight.sh
          echo M6_G5D_WINDOWS_PREFLIGHT_ONLY_OK

  linux-x64:
    name: Linux x64 G5c
    if: inputs.platform == 'linux-x64' || inputs.platform == 'all-desktop'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Check out NaiveProxy
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out pinned forwardproxy
        uses: actions/checkout@v4
        with:
          repository: ssharkkky/forwardproxy
          ref: f14924cdedc93c28a2b92c8120538ea5beee28fb
          path: _m6/forwardproxy
          fetch-depth: 0

      - name: Check out pinned Caddy
        uses: actions/checkout@v4
        with:
          repository: ssharkkky/caddy
          ref: dd9a89c11194dcb806d845233995ef040f096464
          path: _m6/caddy
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.12
          cache: false

      - name: Restore Chromium toolchain
        uses: actions/cache@v4
        with:
          path: |
            src/third_party/llvm-build/Release+Asserts/
            src/gn/
          key: toolchains-posix-${{ hashFiles('CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}

      - name: Restore Linux PGO profiles
        uses: actions/cache@v4
        with:
          path: src/chrome/build/pgo_profiles/
          key: pgo-linux-openwrt-${{ hashFiles('CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}

      - name: Restore Linux x64 sysroot
        uses: actions/cache@v4
        with:
          path: |
            src/out/sysroot-build/bullseye/bullseye_amd64
            src/out/sysroot-build/trixie/trixie_amd64
            src/out/sysroot-build/sid/sid_amd64
          key: sysroot-linux-x64-${{ hashFiles('CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config ccache bubblewrap openssl lsof
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@v0.4.5

      - name: Build NaiveProxy Release and native UDP targets
        working-directory: src
        env:
          EXTRA_FLAGS: 'target_cpu="x64"'
        run: |
          ./get-clang.sh
          ./build.sh
          ninja -C out/Release naive_socks5_udp_test \
            naive_connect_udp_backend_test naive_socks5_udp_m3_runner

      - name: Build pinned Caddy and forwardproxy server
        run: |
          mkdir -p _m6/forwardproxy/build
          GO_BIN="$(command -v go)" \
          XCADDY_BIN="$(go env GOPATH)/bin/xcaddy" \
          CADDY_SOURCE_DIR="$GITHUB_WORKSPACE/_m6/caddy" \
            _m6/forwardproxy/scripts/build-naive-caddy.sh \
            "$GITHUB_WORKSPACE/_m6/forwardproxy/build/m4-caddy"

      - name: Run Linux x64 qualification
        env:
          GO_BIN: go
          M6_FORWARDPROXY_DIR: ${{ github.workspace }}/_m6/forwardproxy
          M6_CADDY_DIR: ${{ github.workspace }}/_m6/caddy
          M6_CADDY_BIN: ${{ github.workspace }}/_m6/forwardproxy/build/m4-caddy
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          ./tests/m6/g5_linux_qualification.sh | tee _m6/linux-x64.log
          grep -q '^M6_G5C_LINUX_X64_OK$' _m6/linux-x64.log

      - name: Write redacted platform evidence
        if: always()
        run: |
          mkdir -p _m6/evidence
          {
            echo 'platform=linux-x64'
            echo "os=$(source /etc/os-release; echo "$PRETTY_NAME")"
            echo "architecture=$(uname -m)"
            echo "naive_revision=$(git rev-parse HEAD)"
            echo "forwardproxy_revision=$(git -C _m6/forwardproxy rev-parse HEAD)"
            echo "caddy_revision=$(git -C _m6/caddy rev-parse HEAD)"
            grep '^M[356]_' _m6/linux-x64.log 2>/dev/null || true
          } >_m6/evidence/linux-x64.txt

      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m6-linux-x64-${{ github.sha }}
          path: _m6/evidence/linux-x64.txt
          if-no-files-found: error

  windows-x64:
    name: Windows x64 G5d
    if: inputs.platform == 'windows-x64' || inputs.platform == 'all-desktop'
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out NaiveProxy
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out pinned forwardproxy
        uses: actions/checkout@v4
        with:
          repository: ssharkkky/forwardproxy
          ref: f14924cdedc93c28a2b92c8120538ea5beee28fb
          path: _m6/forwardproxy
          fetch-depth: 0

      - name: Check out pinned Caddy
        uses: actions/checkout@v4
        with:
          repository: ssharkkky/caddy
          ref: dd9a89c11194dcb806d845233995ef040f096464
          path: _m6/caddy
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.12
          cache: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore Windows toolchain
        uses: actions/cache@v4
        with:
          path: |
            src/third_party/llvm-build/Release+Asserts/
            src/gn/
            ~/bin/ninja.exe
          key: toolchains-win-${{ hashFiles('CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}

      - name: Restore Windows x64 PGO profile
        uses: actions/cache@v4
        with:
          path: src/chrome/build/pgo_profiles/chrome-win64-*
          key: pgo-win64-${{ hashFiles('CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}

      - name: Preflight Windows runtime semantics
        timeout-minutes: 3
        run: |
          ./tests/m6/g5_windows_trust_preflight.sh

      - name: Install build dependencies
        run: |
          mkdir -p "$HOME/bin"
          if [ ! -x "$HOME/bin/ninja.exe" ]; then
            curl -fsSLO https://github.com/ninja-build/ninja/releases/download/v1.13.1/ninja-win.zip
            unzip -q ninja-win.zip -d "$HOME/bin"
          fi
          echo "$HOME/bin" >>"$GITHUB_PATH"
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@v0.4.5

      - name: Build NaiveProxy Release and native UDP targets
        working-directory: src
        env:
          EXTRA_FLAGS: 'target_cpu="x64"'
        run: |
          ./get-clang.sh
          ./build.sh
          test -x out/Release/naive.exe

      - name: Build pinned Caddy and forwardproxy server
        run: |
          workspace=$(cygpath -u "$GITHUB_WORKSPACE")
          mkdir -p "$workspace/_m6/forwardproxy/build"
          GO_BIN="$(command -v go)" \
          XCADDY_BIN="$(go env GOPATH)/bin/xcaddy" \
          CADDY_SOURCE_DIR="$workspace/_m6/caddy" \
            "$workspace/_m6/forwardproxy/scripts/build-naive-caddy.sh" \
            "$workspace/_m6/forwardproxy/build/m4-caddy.exe"

      - name: Run Windows x64 qualification
        env:
          GO_BIN: go
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          workspace=$(cygpath -u "$GITHUB_WORKSPACE")
          M6_FORWARDPROXY_DIR="$workspace/_m6/forwardproxy" \
          M6_CADDY_DIR="$workspace/_m6/caddy" \
          M6_CADDY_BIN="$workspace/_m6/forwardproxy/build/m4-caddy.exe" \
            ./tests/m6/g5_windows_qualification.sh | tee _m6/windows-x64.log
          grep -q '^M6_G5D_WINDOWS_X64_OK$' _m6/windows-x64.log

      - name: Write redacted platform evidence
        if: always()
        run: |
          mkdir -p _m6/evidence
          {
            echo 'platform=windows-x64'
            echo "os=$(cmd.exe /c ver | tr -d '\r')"
            echo "architecture=$(uname -m)"
            echo "naive_revision=$(git rev-parse HEAD)"
            echo "forwardproxy_revision=$(git -C _m6/forwardproxy rev-parse HEAD)"
            echo "caddy_revision=$(git -C _m6/caddy rev-parse HEAD)"
            grep '^M[356]_' _m6/windows-x64.log 2>/dev/null || true
          } >_m6/evidence/windows-x64.txt

      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m6-windows-x64-${{ github.sha }}
          path: _m6/evidence/windows-x64.txt
          if-no-files-found: error

  android-arm64-build:
    name: Android arm64 G5e build readiness
    if: inputs.platform == 'android-arm64-build'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Check out NaiveProxy
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Restore Chromium toolchain
        uses: actions/cache@v4
        with:
          path: |
            src/third_party/llvm-build/Release+Asserts/
            src/gn/
            src/qemu-user*.deb
          key: toolchains-posix-${{ hashFiles('CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}

      - name: Restore Android NDK
        uses: actions/cache@v4
        with:
          path: src/third_party/android_toolchain/ndk/
          key: android-ndk-${{ hashFiles('CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}

      - name: Restore Android arm64 sysroot
        uses: actions/cache@v4
        with:
          path: src/out/sysroot-build/android/
          key: sysroot-android-arm64-${{ hashFiles('CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-m6-android-${{ hashFiles('apk/**/*.gradle', 'apk/**/*.gradle.kts', 'apk/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config ccache bubblewrap unzip

      - name: Build Android arm64 NaiveProxy
        working-directory: src
        env:
          EXTRA_FLAGS: 'target_os="android" target_cpu="arm64"'
        run: |
          ./get-clang.sh
          ./build.sh
          ./get-android-sys.sh

      - name: Build Android arm64 plugin APK
        working-directory: apk
        env:
          APK_ABI: arm64-v8a
          APK_VERSION_NAME: v1.1.1.1-1
          KEYSTORE_PASS: qualification-only-unused
        run: |
          mkdir -p app/libs/arm64-v8a
          cp ../src/out/Release/naive app/libs/arm64-v8a/libnaive.so
          ./gradlew --no-daemon :app:assembleDebug

      - name: Verify Android arm64 package boundary
        run: |
          mkdir -p _m6
          apk_path=$(find apk/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$apk_path"
          M6_ANDROID_APK="$apk_path" ./tests/m6/g5_android_build.sh | tee _m6/android-arm64-build.log
          grep -q '^M6_G5E_ANDROID_ARM64_BUILD_READY$' _m6/android-arm64-build.log

      - name: Stage Android arm64 runtime package
        run: |
          mkdir -p _m6/android-runtime
          apk_path=$(find apk/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$apk_path"
          cp "$apk_path" _m6/android-runtime/naiveproxy-plugin-arm64-v8a-debug.apk
          (
            cd _m6/android-runtime
            sha256sum naiveproxy-plugin-arm64-v8a-debug.apk >SHA256SUMS
          )

      - name: Upload Android arm64 runtime package
        uses: actions/upload-artifact@v4
        with:
          name: m6-android-arm64-runtime-${{ github.sha }}
          path: _m6/android-runtime/
          if-no-files-found: error
          retention-days: 7

      - name: Write redacted build evidence
        if: always()
        run: |
          mkdir -p _m6/evidence
          {
            echo 'platform=android-arm64-build-readiness'
            echo "host_os=$(source /etc/os-release; echo "$PRETTY_NAME")"
            echo 'architecture=arm64-v8a'
            echo "naive_revision=$(git rev-parse HEAD)"
            grep '^M6_' _m6/android-arm64-build.log 2>/dev/null || true
          } >_m6/evidence/android-arm64-build.txt

      - name: Upload redacted build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m6-android-arm64-build-${{ github.sha }}
          path: _m6/evidence/android-arm64-build.txt
          if-no-files-found: error
